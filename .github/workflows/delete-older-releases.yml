name: delete-older-releases
on:
  workflow_dispatch:
  schedule:
    - cron: 0 22 * * *
    
jobs:
  del_runs:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # 删除 Release 与 tag 所需
      actions: write   # 删除旧工作流运行记录所需
    steps:
    
    - name: 删除工作流
      uses: GitRML/delete-workflow-runs@v1.2.2
      with:
        retain_days: 15
        keep_minimum_runs: 6
    
    - name: 删除旧的Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 21
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
